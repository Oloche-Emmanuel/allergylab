name: AllergyLab CI/CD

on: [push]

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    - name: Build images
      run: |
            cd Part7a
            docker build -t ${{secrets.DOCKER_USERNAME}}/allergy-lab-app:latest app/.
            docker build -t ${{secrets.DOCKER_USERNAME}}/allergy-lab-email:latest email/.
            docker build -t ${{secrets.DOCKER_USERNAME}}/allergy-lab-db-loader:latest db-loader/.
    - name: Log in to Docker
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Push images
      run: |
            docker push ${{secrets.DOCKER_USERNAME}}/allergy-lab-app:latest
            docker push ${{secrets.DOCKER_USERNAME}}/allergy-lab-email:latest
            docker push ${{secrets.DOCKER_USERNAME}}/allergy-lab-db-loader:latest